name: arena-passport-production

services:
  postgres:
    image: postgres:17-alpine
    container_name: arena-passport-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arena_passport}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena_passport}']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - arena-passport-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: arena-passport-redis
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.6
    volumes:
      - arena-passport-redis-data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: production
    container_name: arena-passport-api
    env_file: .env.production
    environment:
      CI: 'true'
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000,http://localhost:3001}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      PRIVATE_UPLOAD_ROOT: ${PRIVATE_UPLOAD_ROOT:-/data/evidence/private}
      PUBLIC_MEDIA_ROOT: ${PUBLIC_MEDIA_ROOT:-/data/evidence/public/players}
      IP_HASH_SALT: ${IP_HASH_SALT}
      SESSION_TOKEN_HASH_SECRET: ${SESSION_TOKEN_HASH_SECRET}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY}
      METRICS_TOKEN: ${METRICS_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok) process.exit(1); process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - arena-passport-evidence:/data/evidence
    mem_limit: 1.5g
    cpus: 1.5

  api-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    container_name: arena-passport-api-migrate
    env_file: .env.production
    environment:
      CI: 'true'
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      IP_HASH_SALT: ${IP_HASH_SALT}
      SESSION_TOKEN_HASH_SECRET: ${SESSION_TOKEN_HASH_SECRET}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY}
      METRICS_TOKEN: ${METRICS_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    command: ["sh", "-lc", "pnpm --filter @arena/api prisma:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: production
    container_name: arena-passport-web
    env_file: .env.production
    environment:
      CI: 'true'
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok) process.exit(1); process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1.2g
    cpus: 1

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      target: production
    container_name: arena-passport-admin
    env_file: .env.production
    environment:
      CI: 'true'
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok) process.exit(1); process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.8

volumes:
  arena-passport-postgres-data:
  arena-passport-redis-data:
  arena-passport-evidence:
