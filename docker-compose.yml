name: arena-passport

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arena_passport}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
    ports:
      - '5433:5432'
    volumes:
      - arena-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena_passport}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - arena-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD:-arena_local_only}@postgres:5432/${POSTGRES_DB:-arena_passport}?schema=public
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://localhost:3000
      IP_HASH_SALT: ${IP_HASH_SALT:-arena-local-ip-salt-change-me}
    ports:
      - '4000:4000'
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      INTERNAL_API_URL: http://api:4000/api/v1
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy

volumes:
  arena-postgres:
  arena-redis:
